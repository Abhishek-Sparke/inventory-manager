name: StockFlow Unsigned IPA
on:
  push:
    branches:
      - feature/offline-android
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Select Xcode 16.1+
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true
          xcodebuild -version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild-unsigned.log
      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/mobile.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found"
            find build -name "*.app" -print
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry StockFlow.ipa Payload
          test -s StockFlow.ipa
          ls -lh StockFlow.ipa
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StockFlow-IPA
          path: apps/mobile/StockFlow.ipa
          retention-days: 14
      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StockFlow-iOS-Build-Logs
          path: apps/mobile/xcodebuild-unsigned.log
          if-no-files-found: ignore
          retention-days: 7
