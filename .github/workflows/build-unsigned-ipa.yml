name: StockFlow Unsigned IPA
on:
  push:
    branches:
      - feature/offline-android
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Select compatible Xcode 26 toolchain
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.5.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif ls -d /Applications/Xcode_26* 1> /dev/null 2>&1; then
            LATEST_XCODE_26=$(ls -d /Applications/Xcode_26* | sort -V | tail -n 1)
            sudo xcode-select -s "$LATEST_XCODE_26/Contents/Developer"
          else
            echo "::error::Xcode 26 was not found on this runner."
            exit 1
          fi
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Patch CocoaPods rsync and script permissions
        run: |
          echo "Patching CocoaPods framework copy scripts..."
          find ios/Pods -name "*-frameworks.sh" -exec sed -i '' 's/rsync --delete -av --filter/rsync --delete -av --no-perms --filter/g' {} + || true
          find ios/Pods -name "Script-*.sh" -exec sed -i '' 's/rsync --delete -av --filter/rsync --delete -av --no-perms --filter/g' {} + || true
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            | tee xcodebuild-unsigned.log
      - name: Build unsigned iOS widget extension
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/mobile.xcodeproj \
            -target StockFlowWidgetExtension \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            | tee xcodebuild-widget.log
      - name: Package IPA with widget extension
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/mobile.app"
          WIDGET_PATH="build/Build/Products/Release-iphoneos/StockFlowWidgetExtension.appex"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Main app bundle not found"
            find build -name "*.app" -print
            exit 1
          fi
          if [ ! -d "$WIDGET_PATH" ]; then
            echo "::error::Widget extension bundle not found"
            find build -name "*.appex" -print
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p "Payload/mobile.app/PlugIns"
          cp -R "$WIDGET_PATH" "Payload/mobile.app/PlugIns/"
          echo "Verifying widget extension in packaged app..."
          test -d "Payload/mobile.app/PlugIns/StockFlowWidgetExtension.appex"
          /usr/bin/zip -qry StockFlow.ipa Payload
          test -s StockFlow.ipa
          tar -tf StockFlow.ipa | grep -E 'PlugIns/StockFlowWidgetExtension.appex/' | head -n 10
          ls -lh StockFlow.ipa
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StockFlow-IPA
          path: apps/mobile/StockFlow.ipa
          retention-days: 14
      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StockFlow-iOS-Build-Logs
          path: apps/mobile/xcodebuild-unsigned.log
          if-no-files-found: ignore
          retention-days: 7
